<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">线下广告位 AI 协作系统占位图</title>
  <desc id="desc">用于线下广告位 AI 协作系统案例的临时项目封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10120f"/>
      <stop offset="0.56" stop-color="#176b78"/>
      <stop offset="1" stop-color="#f4f1e7"/>
    </linearGradient>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M 84 0 L 0 0 0 84" fill="none" stroke="#fffefa" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="38" flood-color="#10120f" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.9"/>
  <circle cx="1280" cy="250" r="188" fill="#fffefa" fill-opacity="0.13"/>
  <circle cx="1340" cy="310" r="70" fill="#fffefa" fill-opacity="0.18"/>
  <rect x="96" y="96" width="1408" height="808" rx="34" fill="#10120f" fill-opacity="0.46" stroke="#fffefa" stroke-opacity="0.22" stroke-width="2" filter="url(#shadow)"/>
  <path d="M190 746h1220" stroke="#fffefa" stroke-opacity="0.24" stroke-width="2"/>
  <text x="190" y="250" fill="#a9e7f1" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="4">AI COLLABORATION WORKFLOW</text>
  <text x="190" y="370" fill="#fffefa" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="84" font-weight="900">线下广告位</text>
  <text x="190" y="480" fill="#fffefa" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="72" font-weight="800">AI 协作系统</text>
  <text x="190" y="574" fill="#e6eee9" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34">识别场景 / 补全字段 / 推荐条码 / 输出 Brief</text>
  <g fill="#fffefa" fill-opacity="0.82" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">
    <text x="190" y="816">需求接待</text>
    <text x="438" y="816">追问路径</text>
    <text x="666" y="816">规则沉淀</text>
    <text x="894" y="816">协作提效</text>
  </g>
</svg>
