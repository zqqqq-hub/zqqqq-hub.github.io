<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">叁省会员店线下视觉整合占位图</title>
  <desc id="desc">用于叁省会员店线下视觉整合案例的临时项目封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.58" stop-color="#ece8d8"/>
      <stop offset="1" stop-color="#c83b32"/>
    </linearGradient>
    <pattern id="grid" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M 92 0 L 0 0 0 92" fill="none" stroke="#171814" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#171814" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.85"/>
  <rect x="96" y="96" width="1408" height="808" rx="34" fill="#fffefa" fill-opacity="0.78" stroke="#171814" stroke-opacity="0.12" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1278" cy="238" r="150" fill="#c83b32" fill-opacity="0.16"/>
  <circle cx="1334" cy="290" r="54" fill="#c83b32" fill-opacity="0.2"/>
  <path d="M190 746h1220" stroke="#171814" stroke-opacity="0.18" stroke-width="2"/>
  <text x="190" y="250" fill="#1d6fff" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="4">OFFLINE VISUAL SYSTEM</text>
  <text x="190" y="370" fill="#171814" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="88" font-weight="900">叁省会员店</text>
  <text x="190" y="480" fill="#171814" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="72" font-weight="800">线下视觉整合</text>
  <text x="190" y="574" fill="#56594f" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34">商场广告位 / 门店 POP / 开业整合物料 / 可复制物料库</text>
  <g fill="#171814" fill-opacity="0.78" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">
    <text x="190" y="816">广告位判断</text>
    <text x="438" y="816">用户动线</text>
    <text x="666" y="816">信息层级</text>
    <text x="894" y="816">物料复用</text>
  </g>
</svg>
